<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro Jornada Laboral - AGOIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "agoin-green": "#1B5E4B",
              "agoin-teal": "#63988e",
              "agoin-dark": "#2c2c2c",
              "agoin-darker": "#121212",
              "agoin-light": "#f3f3f3",
            },
            fontFamily: {
              sans: ["Poppins", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        font-family: "Poppins", sans-serif;
      }
      @page {
        size: A4;
        margin: 1.5cm;
      }
      @media print {
        body {
          margin: 0;
          padding: 0;
          background-color: white !important;
        }
        .no-print {
          display: none !important;
        }
      }
      .print-render-container {
        position: absolute;
        top: 0;
        left: -9999px;
        width: 210mm; /* A4 width */
        background: #fff;
        z-index: -999;
      }
      .text-xxs {
        font-size: 0.65rem; /* 10.4px */
        line-height: 0.85rem; /* 13.6px */
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-agoin-darker text-agoin-light">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
